services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finreminder}
      POSTGRES_USER: ${POSTGRES_USER:-finreminder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finreminder}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finreminder}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finreminder}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      REMINDER_DAYS: ${REMINDER_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"   # local-dev access; on the VPS Traefik routes by Host label
    depends_on:
      - api
    labels:
      traefik.enable: "true"
      traefik.http.routers.finreminder.entrypoints: "websecure"
      traefik.http.routers.finreminder.priority: "10"
      traefik.http.routers.finreminder.rule: "Host(`app.narukullapati.com`)"
      traefik.http.routers.finreminder.tls: "true"
      traefik.http.routers.finreminder.tls.certresolver: "letsencrypt"
      traefik.http.services.finreminder.loadbalancer.server.port: "80"

volumes:
  pgdata:
